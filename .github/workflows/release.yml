# Build the packages for a version tag and attach them to a draft GitHub release:
# Linux (x86_64 and arm64), Windows and macOS.
# Start it with scripts/release.sh X.Y.Z, then: git push origin main vX.Y.Z
#
# Run by hand (Actions > Release > Run workflow) it builds the same packages from the
# chosen branch without making a release, and keeps them as the run's artifacts: a test
# build for checking other systems before a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version" 'index($0, "## [" v "]") == 1 {on = 1; next} /^## \[/ {on = 0} on' CHANGELOG.md)
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          {
            echo "body<<SPARKY_NOTES"
            printf '%s\n' "$notes"
            echo "SPARKY_NOTES"
          } >> "$GITHUB_OUTPUT"

  linux:
    needs: notes
    if: ${{ !cancelled() && needs.notes.result != 'failure' }}
    # The oldest supported Ubuntu, so the AppImage and .deb run on older distributions too.
    # Built natively on each architecture: arm64 is for the Raspberry Pi 4/5 and other
    # 64-bit ARM boards (#15).
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libudev-dev libasound2-dev librsvg2-dev patchelf file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test the core
        run: cargo test --locked

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy's bundled strip can't read newer ELF sections; skipping it avoids
          # "failed to run linuxdeploy" on some systems.
          NO_STRIP: true
        with:
          projectPath: app
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: ${{ github.event_name == 'push' && format('SparkyMK2 {0}', github.ref_name) || '' }}
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: true
          args: --bundles deb,rpm,appimage

      - name: Keep the test build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: sparkymk2-${{ github.job }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg

  windows:
    needs: notes
    if: ${{ !cancelled() && needs.notes.result != 'failure' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test the core
        run: cargo test --locked

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: ${{ github.event_name == 'push' && format('SparkyMK2 {0}', github.ref_name) || '' }}
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: true
          args: --bundles msi,nsis

      - name: Keep the test build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: sparkymk2-${{ github.job }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg

  macos:
    needs: notes
    if: ${{ !cancelled() && needs.notes.result != 'failure' }}
    # Apple Silicon; the DMG is arm64 only. macOS ships WebKit, so there is nothing to
    # install first.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test the core
        run: cargo test --locked

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # Unsigned: there is no Apple Developer account behind this, so Gatekeeper
      # quarantines the download. The README says how to open it.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: ${{ github.event_name == 'push' && format('SparkyMK2 {0}', github.ref_name) || '' }}
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: true
          args: --bundles dmg

      - name: Keep the test build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: sparkymk2-${{ github.job }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
