# Build the Linux packages for a version tag and attach them to a draft GitHub release.
# Start it with scripts/release.sh X.Y.Z, then: git push origin main vX.Y.Z
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version" 'index($0, "## [" v "]") == 1 {on = 1; next} /^## \[/ {on = 0} on' CHANGELOG.md)
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          {
            echo "body<<SPARKY_NOTES"
            printf '%s\n' "$notes"
            echo "SPARKY_NOTES"
          } >> "$GITHUB_OUTPUT"

  linux:
    needs: notes
    # The oldest supported Ubuntu, so the AppImage and .deb run on older distributions too.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libudev-dev librsvg2-dev patchelf file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test the core
        run: cargo test --locked

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy's bundled strip can't read newer ELF sections; skipping it avoids
          # "failed to run linuxdeploy" on some systems.
          NO_STRIP: true
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: SparkyMK2 ${{ github.ref_name }}
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: true
          args: --bundles deb,rpm,appimage

  windows:
    needs: notes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test the core
        run: cargo test --locked

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: SparkyMK2 ${{ github.ref_name }}
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: true
          args: --bundles msi,nsis

  macos:
    needs: notes
    # Apple Silicon; the DMG is arm64 only. macOS ships WebKit, so there is nothing to
    # install first.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test the core
        run: cargo test --locked

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # Unsigned: there is no Apple Developer account behind this, so Gatekeeper
      # quarantines the download. The README says how to open it.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: SparkyMK2 ${{ github.ref_name }}
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: true
          args: --bundles dmg
